<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fcf8f1">
  
  <!-- Balises pour masquer le bandeau du navigateur (PWA / Web App) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>Défis Photobooth</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --ivory: #fcf8f1;
      --champagne: #f2e6d3;
      --gold: #c9a24a;
      --gold-deep: #9a7621;
      --ink: #4a3338;
      --sage: #8fa17f;
      --rose-1: #b5415f;
      --rose-2: #e05275;

      /* Tailles qui s'adaptent à la hauteur de l'écran du téléphone */
      --fig: clamp(60px, 11dvh, 88px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html { -webkit-text-size-adjust: 100%; background: var(--champagne); }

    body {
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 0%, #ffffff 0%, var(--ivory) 45%, var(--champagne) 100%);
      color: var(--ink);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    }

    /* Lueurs douces en arrière-plan */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle 120px at 12% 24%, rgba(243, 182, 196, 0.35), transparent),
        radial-gradient(circle 90px at 90% 18%, rgba(201, 162, 74, 0.25), transparent),
        radial-gradient(circle 150px at 84% 66%, rgba(243, 182, 196, 0.25), transparent),
        radial-gradient(circle 100px at 14% 74%, rgba(201, 162, 74, 0.20), transparent);
    }

    .decor { position: fixed; pointer-events: none; z-index: 0; }

    .branche { bottom: 0; width: 100px; height: 146px; }
    .branche.gauche { left: 0; }
    .branche.droite { right: 0; transform: scaleX(-1); }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(8px, 1.6dvh, 14px);
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .logo {
      display: block;
      width: clamp(150px, 24dvh, 230px);
      max-width: 72vw;
      height: auto;
      /* Espace laissé par les anciennes alliances, entre le logo et le titre */
      margin-bottom: calc(clamp(54px, 9dvh, 82px) * 0.633 + 4px);
      /* Remonte le logo sans bouger le reste de la page */
      position: relative;
      top: -16px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.55rem, 4.4dvh, 2.1rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--gold-deep) 0%, var(--gold) 50%, var(--gold-deep) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-family: 'Playfair Display', serif;
      font-size: clamp(0.9rem, 2.2dvh, 1rem);
      font-style: italic;
      color: rgba(74, 51, 56, 0.75);
    }

    /* Pièce montée : les mariés se tiennent en haut de la carte */
    .piece {
      position: relative;
      width: 100%;
      margin: calc(var(--fig) * 1.47 + 4px) 0 clamp(6px, 1.6dvh, 16px);
    }

    .figurine {
      position: absolute;
      right: 14px;
      bottom: calc(100% - 3px);
      width: var(--fig);
      height: auto;
      filter: drop-shadow(0 3px 4px rgba(74, 51, 56, 0.25));
    }

    .card {
      width: 100%;
      min-height: clamp(130px, 21dvh, 190px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 18px;
      font-size: clamp(1.15rem, 2.8dvh, 1.4rem);
      font-weight: 600;
      line-height: 1.4;
      text-wrap: balance;
      overflow-wrap: anywhere;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(201, 162, 74, 0.55);
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(154, 118, 33, 0.15), inset 0 0 14px rgba(201, 162, 74, 0.08);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                  border-color 0.3s, box-shadow 0.3s;
    }

    .card.placeholder {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      color: rgba(74, 51, 56, 0.6);
    }

    .card.limit {
      font-family: 'Playfair Display', serif;
      color: var(--gold-deep);
      border-color: rgba(201, 162, 74, 0.95);
    }

    .card.stopped {
      transform: scale(1.02);
      border-color: rgba(201, 162, 74, 1);
