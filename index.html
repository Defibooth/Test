  <script>
    // Si le téléphone affiche la page en « version ordinateur » (page ~980 px de large, tout paraît
    // minuscule), on la recale sur la largeur réelle de l'écran. Sans effet sur un téléphone normal.
    (function () {
      var w = screen.width;
      if (navigator.maxTouchPoints > 0 && w < 700 && window.innerWidth > w * 1.4) {
        document.documentElement.classList.add('mode-pc');
        document.documentElement.style.setProperty('--k', window.innerWidth / w);
      }
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --ivory: #fcf8f1;
      --champagne: #f2e6d3;
      --gold: #c9a24a;
      --gold-deep: #9a7621;
      --ink: #4a3338;
      --sage: #8fa17f;
      --rose-1: #b5415f;
      --rose-2: #e05275;

      /* Tailles qui s'adaptent à la hauteur de l'écran du téléphone */
      --fig: clamp(66px, 12dvh, 96px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html { -webkit-text-size-adjust: 100%; background: var(--champagne); }

    body {
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 0%, #ffffff 0%, var(--ivory) 45%, var(--champagne) 100%);
      color: var(--ink);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    }

    /* « Version ordinateur » sur téléphone : on dessine la page à la largeur de l'écran puis on l'agrandit */
    html.mode-pc body {
      width: calc(100vw / var(--k));
      min-height: calc(100vh / var(--k));
      transform: scale(var(--k));
      transform-origin: 0 0;
    }

    /* Lueurs douces en arrière-plan */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle 120px at 12% 24%, rgba(243, 182, 196, 0.35), transparent),
        radial-gradient(circle 90px at 90% 18%, rgba(201, 162, 74, 0.25), transparent),
        radial-gradient(circle 150px at 84% 66%, rgba(243, 182, 196, 0.25), transparent),
        radial-gradient(circle 100px at 14% 74%, rgba(201, 162, 74, 0.20), transparent);
    }

    .decor { position: fixed; pointer-events: none; z-index: 0; }

    .branche { bottom: 0; width: 100px; height: 146px; }
    .branche.gauche { left: 0; }
    .branche.droite { right: 0; transform: scaleX(-1); }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(8px, 1.6dvh, 14px);
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .logo {
      display: block;
      width: clamp(170px, 27dvh, 260px);
      max-width: 72vw;
      height: auto;
      /* Remonte le logo sans bouger le reste de la page */
      position: relative;
      top: -16px;
    }

    .alliances {
      display: block;
      width: clamp(96px, 14.5dvh, 130px);
      height: auto;
      filter: drop-shadow(0 3px 4px rgba(154, 118, 33, 0.3));
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.7rem, 4.8dvh, 2.3rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--gold-deep) 0%, var(--gold) 50%, var(--gold-deep) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .evenement {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(0.8rem, 2dvh, 0.95rem);
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-deep);
    }

    .subtitle {
      font-family: 'Playfair Display', serif;
      font-size: clamp(0.95rem, 2.4dvh, 1.1rem);
      font-style: italic;
      color: rgba(74, 51, 56, 0.75);
    }

    /* Pièce montée : les mariés se tiennent en haut de la carte */
    .piece {
      position: relative;
      width: 100%;
      margin: calc(var(--fig) * 1.47 + 4px) 0 clamp(6px, 1.6dvh, 16px);
    }

    /* Deux flûtes de champagne qui trinquent, à gauche des mariés */
    .flutes {
      position: absolute;
      left: 14px;
      bottom: calc(100% - 4px);
      width: calc(var(--fig) * 1.25);
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 3px 4px rgba(74, 51, 56, 0.25));
    }

    /* Position « trinquer » par défaut (animations coupées) ; les verres pivotent autour de leur pied */
    .fl.gauche { transform: rotate(10.8deg); animation: trinqueG 3.2s ease-in-out infinite; }
    .fl.droite { transform: rotate(-10.8deg); animation: trinqueD 3.2s ease-in-out infinite; }

    /* Les verres se lèvent, se penchent l'un vers l'autre, trinquent, puis reviennent */
    @keyframes trinqueG {
      0%, 28%  { transform: rotate(-9deg); }
      44%, 48% { transform: rotate(10.8deg); }
      58%      { transform: rotate(5deg); }
      74%, 100% { transform: rotate(-9deg); }
    }
    @keyframes trinqueD {
      0%, 28%  { transform: rotate(9deg); }
      44%, 48% { transform: rotate(-10.8deg); }
      58%      { transform: rotate(-5deg); }
      74%, 100% { transform: rotate(9deg); }
    }

    /* Gerbe d'éclats au moment du choc */
    .eclat {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      animation: eclat 3.2s ease-out infinite;
    }
    @keyframes eclat {
      0%, 42%  { opacity: 0; transform: scale(0.2); }
      47%      { opacity: 1; transform: scale(1.25); }
      64%, 100% { opacity: 0; transform: scale(1.6); }
    }

    /* Bulles de champagne qui montent */
    .bulle {
      opacity: 0;
      animation: bulle 2s linear infinite;
    }
    @keyframes bulle {
      0%   { opacity: 0;   transform: translateY(0); }
      15%  { opacity: 0.9; }
      85%  { opacity: 0.9; }
      100% { opacity: 0;   transform: translateY(-31px); }
    }

    .figurine {
      position: absolute;
      right: 14px;
      bottom: calc(100% - 3px);
      width: var(--fig);
      height: auto;
      filter: drop-shadow(0 3px 4px rgba(74, 51, 56, 0.25));
      /* Les pieds restent posés sur la carte : le couple pivote autour de sa base */
      transform-origin: 50% 100%;
      animation: valse 8s ease-in-out infinite, rebond 1.8s ease-in-out infinite;
    }

    /* Valse sur place : le couple fait un tour complet sur lui-même, face à nous au début et à la fin */
    @keyframes valse {
      0%, 22%   { transform: perspective(600px) rotateY(0deg); }
      78%, 100% { transform: perspective(600px) rotateY(360deg); }
    }

    /* Petit rebond de valse (propriété « translate » : s'ajoute à la rotation) */
    @keyframes rebond {
      0%, 100% { translate: 0 0; }
      50%      { translate: 0 -3px; }
    }

    /* Étoiles dorées qui scintillent dans les marges (jamais derrière le titre) */
    .etincelles span {
      position: fixed;
      color: var(--gold);
      line-height: 1;
      opacity: 0;
      animation: scintille 3.4s ease-in-out infinite;
    }
    .etincelles span::before { content: "\2726"; }

    @keyframes scintille {
      0%, 100% { opacity: 0;    transform: scale(0.5) rotate(0deg); }
      50%      { opacity: 0.85; transform: scale(1.1) rotate(25deg); }
    }

    .card {
      width: 100%;
      min-height: clamp(140px, 22dvh, 200px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 18px;
      font-size: clamp(1.25rem, 3dvh, 1.55rem);
      font-weight: 600;
      line-height: 1.4;
      text-wrap: balance;
      overflow-wrap: anywhere;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(201, 162, 74, 0.55);
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(154, 118, 33, 0.15), inset 0 0 14px rgba(201, 162, 74, 0.08);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                  border-color 0.3s, box-shadow 0.3s;
    }

    .card.placeholder {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      color: rgba(74, 51, 56, 0.6);
    }

    .card.limit {
      font-family: 'Playfair Display', serif;
      color: var(--gold-deep);
      border-color: rgba(201, 162, 74, 0.95);
    }

    .card.stopped {
      transform: scale(1.02);
      border-color: rgba(201, 162, 74, 1);
      box-shadow: 0 0 26px rgba(201, 162, 74, 0.4), inset 0 0 18px rgba(201, 162, 74, 0.12);
    }

    /* Bouton pensé pour le pouce : grande zone tactile */
    button {
      width: 100%;
      min-height: 60px;
      margin-top: 4px;
      padding: 16px 0;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #b8902f 0%, #dcb860 50%, #a8801f 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      box-shadow: 0 6px 20px rgba(154, 118, 33, 0.3);
      transition: transform 0.2s, box-shadow 0.3s;
    }

    button:active { transform: scale(0.97); }
    button:focus-visible { outline: 2px solid var(--gold-deep); outline-offset: 3px; }

    /* Le survol n'existe que sur ordinateur : évite le bouton "collé" sur mobile */
    @media (hover: hover) {
      button:hover { box-shadow: 0 8px 25px rgba(154, 118, 33, 0.45); transform: translateY(-2px); }
    }

    /* Rose poudré, plus clair et raffiné */
    button.running {
      color: #6b2c40;
      background: linear-gradient(135deg, #eaa9b9 0%, #f8d3db 50%, #e59fb1 100%);
      box-shadow: 0 6px 20px rgba(214, 130, 154, 0.35);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Écrans étroits : branches plus petites pour ne pas gêner */
    @media (max-width: 420px) {
      .branche { width: 72px; height: 105px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>

  <script>
    // Textes de l'en-tête, pris dans les RÉGLAGES en haut du fichier
    document.getElementById('titre').textContent = REGLAGES.titre;
    document.getElementById('sousTitre').textContent = REGLAGES.sousTitre;
    if (REGLAGES.evenement && REGLAGES.evenement.trim()) {
      const ev = document.getElementById('evenement');
      ev.textContent = REGLAGES.evenement;
      ev.hidden = false;
    }

    const tousLesDefis = REGLAGES.defis.filter(d => typeof d === 'string' && d.trim());

    // ---- Pioche mélangée ----
    // Les défis sont mélangés comme un jeu de cartes (mélange de Fisher-Yates, avec le générateur
    // aléatoire sécurisé du navigateur). On pioche dans l'ordre : aucun défi ne revient avant que
    // tous soient passés. La pioche est mémorisée sur l'appareil : elle survit à un rechargement
    // de la page (par exemple après le QR code), donc on ne repart pas toujours des mêmes défis.
    const CLE = 'defis-pioche-v1:' + location.pathname;  // une mémoire par jeu
    let pioche = [];   // défis dans l'ordre du mélange
    let position = 0;  // prochain défi à tirer

    function hasard(n) {
      // Entier aléatoire équitable entre 0 et n-1
      if (window.crypto && crypto.getRandomValues) {
        const max = Math.floor(0x100000000 / n) * n;
        const buf = new Uint32Array(1);
        do { crypto.getRandomValues(buf); } while (buf[0] >= max);
        return buf[0] % n;
      }
      return Math.floor(Math.random() * n);
    }

    function melanger(liste) {
      const a = [...liste];
      for (let i = a.length - 1; i > 0; i--) {
        const j = hasard(i + 1);
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function sauver() {
      try { localStorage.setItem(CLE, JSON.stringify({ pioche, position })); } catch (e) {}
    }

    function nouvellePioche(dernier) {
      pioche = melanger(tousLesDefis);
      // Le premier défi du nouveau tour ne doit pas être celui qui vient de sortir
      if (dernier && pioche[0] === dernier && pioche.length > 1) {
        const j = 1 + hasard(pioche.length - 1);
        [pioche[0], pioche[j]] = [pioche[j], pioche[0]];
      }
      position = 0;
    }

    function chargerPioche() {
      try {
        const sauvegarde = JSON.parse(localStorage.getItem(CLE));
        // On réutilise la pioche seulement si la liste de défis n'a pas changé
        const memeListe = sauvegarde
          && Array.isArray(sauvegarde.pioche)
          && sauvegarde.pioche.length === tousLesDefis.length
          && sauvegarde.pioche.every(d => tousLesDefis.includes(d))
          && Number.isInteger(sauvegarde.position);
        if (memeListe) {
          pioche = sauvegarde.pioche;
          position = sauvegarde.position;
          return;
        }
      } catch (e) {}
      nouvellePioche(null);
      sauver();
    }

    function piocherDefi() {
      if (position >= pioche.length) nouvellePioche(pioche[pioche.length - 1]);
      const d = pioche[position++];
      sauver();
      return d;
    }

    chargerPioche();

    // Nombre maximum de défis par session, puis message QR code
    const MAX_DEFIS = REGLAGES.limiteDefis > 0 ? REGLAGES.limiteDefis : Infinity;
    const MESSAGE_FIN = "Flash le QR code pour continuer";

    // Code de déblocage : le QR code doit pointer vers  adresse-de-la-page/?debloquer=CODE
    // (à changer pour un code que tu es seul(e) à connaître)
    const CODE_DEBLOCAGE = REGLAGES.codeDeblocage;

    // Le compteur est mémorisé sur le téléphone : recharger la page ne le remet pas à zéro
    const CLE_COMPTEUR = 'defis-compteur-v1:' + location.pathname;
    let tires = 0;
    try { tires = parseInt(localStorage.getItem(CLE_COMPTEUR), 10) || 0; } catch (e) {}
    function sauverCompteur() {
      try { localStorage.setItem(CLE_COMPTEUR, String(tires)); } catch (e) {}
    }

    const card = document.getElementById('card');
    const btn = document.getElementById('actionBtn');
    let intervalId = null;
    let isRunning = false;
    let affiche = null;

    function afficherFin() {
      card.textContent = MESSAGE_FIN;
      card.classList.remove('stopped', 'placeholder');
      card.classList.add('limit');
      btn.disabled = true;
    }

    // Scan du QR code de déblocage : on remet le compteur à zéro puis on nettoie l'adresse
    try {
      const params = new URLSearchParams(location.search);
      if (params.get('debloquer') === CODE_DEBLOCAGE) {
        tires = 0;
        sauverCompteur();
        history.replaceState(null, '', location.pathname);
      }
    } catch (e) {}

    // Limite déjà atteinte (par exemple après un rechargement de la page) : on reste bloqué
    if (tires >= MAX_DEFIS) afficherFin();

    // Pendant le défilement : simple effet visuel, le vrai défi est tiré au STOP
    function defilement() {
      let d;
      do {
        d = tousLesDefis[hasard(tousLesDefis.length)];
      } while (d === affiche && tousLesDefis.length > 1);
      affiche = d;
      card.textContent = d;
    }

    // Couleurs visibles sur fond clair
    const confettiColors = ['#c9a24a', '#e8cf84', '#e05275', '#f3b6c4', '#8fa17f', '#ffffff'];

    function launchConfetti() {
      if (typeof confetti !== "function") return;

      confetti({ particleCount: 200, spread: 100, startVelocity: 45, origin: { y: 0.6 }, colors: confettiColors });
      confetti({ particleCount: 100, spread: 160, startVelocity: 30, scalar: 1.2, origin: { y: 0.6 }, colors: confettiColors });

      const end = Date.now() + 2000;
      (function frame() {
        confetti({ particleCount: 6, angle: 60, spread: 60, origin: { x: 0, y: 0.7 }, colors: confettiColors });
        confetti({ particleCount: 6, angle: 120, spread: 60, origin: { x: 1, y: 0.7 }, colors: confettiColors });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
    }

    function toggleLoop() {
      if (isRunning) {
        clearInterval(intervalId);
        isRunning = false;
        // Le vrai défi est pioché dans la pioche mélangée
        card.textContent = piocherDefi();
        tires++;
        sauverCompteur();
        btn.textContent = "Recommencer";
        btn.classList.remove('running');
        card.classList.add('stopped');
        if (navigator.vibrate) navigator.vibrate(60);
        launchConfetti();
      } else {
        // Limite atteinte : le message remplace le défi et le bouton se bloque
        if (tires >= MAX_DEFIS) {
          afficherFin();
          return;
        }

        isRunning = true;
        btn.textContent = "Stop !";
        btn.classList.add('running');
        card.classList.remove('stopped', 'placeholder');
        intervalId = setInterval(defilement, 60);
      }
    }
  </script>

</body>
</html>
